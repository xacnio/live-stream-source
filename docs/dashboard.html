<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Source - Remote Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0c14;
            --surface: #1a1a2e;
            --surface-hover: #22223b;
            --border: #2d2d44;
            --text-primary: #f0f0f5;
            --text-secondary: #9aa0a6;
            --accent: #6c5ce7;
            --accent-hover: #8172f3;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(46, 204, 113, 0.05) 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header h1 span {
            color: var(--accent);
        }

        .connection-panel {
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: border-color 0.3s ease;
        }

        .connection-panel:focus-within {
            border-color: var(--accent);
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(12, 12, 20, 0.5);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-family: 'Inter', monospace;
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        button.btn-connect {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.btn-connect:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button.btn-connect:active {
            transform: translateY(1px);
        }

        .source-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .source-tab {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .source-tab:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .source-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .dashboard-content {
            background: rgba(26, 26, 46, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 32px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 15px;
        }

        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.5);
            transition: all 0.3s ease;
        }

        .connection-dot.connected {
            background: var(--success);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        .uptime-display {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .grid-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0%, transparent 100%);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: rgba(12, 12, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .stat-card:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .stat-unit {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-success {
            background: rgba(46, 204, 113, 0.15);
            color: var(--success);
        }

        .badge-danger {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger);
        }

        .badge-neutral {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
        }

        .badge-warning {
            background: rgba(241, 196, 15, 0.15);
            color: var(--warning);
        }

        .global-status {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            color: var(--text-secondary);
            padding: 5px 13px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.20);
            color: var(--text-primary);
        }

        .btn-action.btn-live-edge {
            color: var(--success);
            border-color: rgba(46, 204, 113, 0.25);
        }

        .btn-action.btn-live-edge:hover {
            background: rgba(46, 204, 113, 0.10);
            border-color: rgba(46, 204, 113, 0.40);
        }

        .btn-action:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Live preview panel */
        .preview-panel {
            margin: 0 28px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .preview-stage {
            position: relative;
            background: #000;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-stage img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
        }
        .preview-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 14px;
            letter-spacing: 0.4px;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
        }
        .preview-divider {
            width: 1px;
            height: 22px;
            background: var(--border);
            margin: 0 2px;
        }
        .preview-overlay {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 10px;
            background: rgba(231, 76, 60, 0.85);
            color: #fff;
            font-size: 12px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }
        .preview-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            background: var(--surface-alt, rgba(255,255,255,0.02));
        }
        .preview-meta {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .btn-toggle {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-toggle:hover {
            background: rgba(255,255,255,0.08);
        }
        .btn-toggle[data-state="on"] {
            background: rgba(231, 76, 60, 0.18);
            border-color: rgba(231, 76, 60, 0.55);
            color: #ff8c7a;
        }

        .color-accent {
            color: var(--accent) !important;
        }

        .color-success {
            color: var(--success) !important;
        }

        .color-warning {
            color: var(--warning) !important;
        }

        .color-danger {
            color: var(--danger) !important;
        }

        @media (max-width: 600px) {
            .connection-panel {
                flex-direction: column;
                align-items: stretch;
            }

            .dashboard-content {
                padding: 20px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <div class="header">
            <h1><span>▶</span> Live Stream Source Dashboard</h1>
        </div>

        <div class="connection-panel">
            <div class="input-group">
                <input type="text" id="wsInput" placeholder="ws://localhost:4477/" value="ws://localhost:4477/">
            </div>
            <button class="btn-connect" id="connectBtn">Connect to Server</button>
        </div>

        <div class="source-tabs" id="sourceTabs">
            <!-- Tabs injected dynamically -->
        </div>

        <!-- Live preview persists across re-renders so the <img>/AudioContext
             don't get torn down every stats tick. -->
        <div class="preview-panel" id="previewPanel" hidden>
            <div class="preview-stage">
                <img id="previewImg" alt="Live preview" draggable="false" hidden />
                <div class="preview-placeholder" id="previewPlaceholder">▶ Press Play to start preview</div>
                <div class="preview-overlay" id="previewMutedBadge" hidden>🔇 Output muted</div>
            </div>
            <div class="preview-controls">
                <button class="btn-toggle" id="btnPlay"  data-state="off">▶ Play Preview</button>
                <button class="btn-toggle" id="btnAudio" data-state="off">🔈 Audio: Off</button>
                <span class="preview-divider"></span>
                <button class="btn-toggle" id="btnMute"  data-state="off">🔊 Mute Output</button>
                <button class="btn-toggle" id="btnBlur"  data-state="off">⚫ Blur Output</button>
                <span class="preview-meta" id="previewMeta"></span>
            </div>
        </div>

        <div class="dashboard-content" id="dashboardContent">
            <div class="empty-state">
                <p>Waiting for connection...</p>
            </div>
        </div>

        <div class="global-status" id="globalStatus">Disconnected</div>
    </div>

    <script>
        class DashboardController {
            constructor() {
                this.socket = null;
                this.sourcesData = {};
                this.activeSourceId = null;

                // Preview state — kept outside the per-tick re-render so the
                // <img>, audio graph, and outstanding object URLs persist.
                this.previewObjectUrl = null;
                this.audioCtx = null;
                this.audioGain = null;
                this.audioNextTime = 0;
                this.previewLastVideoMs = 0;
                this.previewSampleCount = 0;
                this.muteState = false;
                this.blurState = false;

                // Preview gates — default OFF so the page doesn't burn CPU
                // and bandwidth on a feed nobody asked for. User flips them
                // via the Play / Audio buttons; we forward as commands so
                // the plugin can also short-circuit its encoder.
                this.previewVideoOn = false;
                this.previewAudioOn = false;

                this.elements = {
                    input: document.getElementById('wsInput'),
                    btnConnect: document.getElementById('connectBtn'),
                    tabsContainer: document.getElementById('sourceTabs'),
                    contentContainer: document.getElementById('dashboardContent'),
                    globalStatus: document.getElementById('globalStatus'),
                    previewPanel: document.getElementById('previewPanel'),
                    previewImg: document.getElementById('previewImg'),
                    previewPlaceholder: document.getElementById('previewPlaceholder'),
                    previewMutedBadge: document.getElementById('previewMutedBadge'),
                    previewMeta: document.getElementById('previewMeta'),
                    btnPlay: document.getElementById('btnPlay'),
                    btnAudio: document.getElementById('btnAudio'),
                    btnMute: document.getElementById('btnMute'),
                    btnBlur: document.getElementById('btnBlur')
                };

                this.bindEvents();
                this.initConnection();
            }

            bindEvents() {
                this.elements.btnConnect.addEventListener('click', () => {
                    this.initConnection(this.elements.input.value);
                });

                this.elements.input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.initConnection(this.elements.input.value);
                });

                this.setupPreviewControls();
            }

            initConnection(url = null) {
                const targetUrl = url || this.elements.input.value;

                if (this.socket) {
                    this.socket.close();
                }

                this.elements.globalStatus.textContent = `Connecting to ${targetUrl}...`;
                this.elements.globalStatus.style.color = 'var(--text-secondary)';

                try {
                    this.socket = new WebSocket(targetUrl);
                    this.socket.binaryType = 'arraybuffer';
                } catch (err) {
                    this.elements.globalStatus.textContent = `Invalid URL provided.`;
                    return;
                }

                this.socket.onopen = () => {
                    this.elements.globalStatus.textContent = `Connected securely to ${targetUrl}`;
                    this.elements.globalStatus.style.color = 'var(--success)';
                    // Lazily start AudioContext on first connect — browsers
                    // require a user gesture, but pressing Connect counts.
                    this.ensureAudioContext();
                    this.elements.previewPanel.hidden = false;
                };

                this.socket.onmessage = (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        this.handleBinaryMessage(event.data);
                        return;
                    }
                    try {
                        const payload = JSON.parse(event.data);
                        if (payload && payload.sources) {
                            this.handleIncomingData(payload.sources);
                        }
                    } catch (e) {
                        console.error("Failed to parse WebSocket message", e);
                    }
                };

                this.socket.onclose = () => {
                    this.elements.globalStatus.textContent = 'Disconnected from server.';
                    this.elements.globalStatus.style.color = 'var(--danger)';
                };

                this.socket.onerror = (err) => {
                    console.error("WebSocket encountered an error:", err);
                    this.socket.close();
                };
            }

            handleIncomingData(sources) {
                this.sourcesData = sources;
                const sourceNames = Object.keys(this.sourcesData);

                if (!this.activeSourceId || !this.sourcesData[this.activeSourceId]) {
                    this.activeSourceId = sourceNames.length > 0 ? sourceNames[0] : null;
                }

                this.renderTabs(sourceNames);
                this.renderDashboard();
            }

            switchSource(sourceId) {
                if (this.sourcesData[sourceId]) {
                    this.activeSourceId = sourceId;
                    this.renderTabs(Object.keys(this.sourcesData));
                    this.renderDashboard();
                }
            }

            renderTabs(sourceNames) {
                this.elements.tabsContainer.innerHTML = '';

                sourceNames.forEach(name => {
                    const btn = document.createElement('div');
                    btn.classList.add('source-tab');
                    if (name === this.activeSourceId) {
                        btn.classList.add('active');
                    }
                    btn.textContent = name;
                    btn.addEventListener('click', () => this.switchSource(name));
                    this.elements.tabsContainer.appendChild(btn);
                });
            }

            renderDashboard() {
                if (!this.activeSourceId) {
                    this.elements.contentContainer.innerHTML = `
                        <div class="empty-state">
                            <p>No active sources found. Start a stream in OBS.</p>
                        </div>
                    `;
                    return;
                }

                const data = this.sourcesData[this.activeSourceId];
                const htmlTemplate = this.generateDashboardHTML(data);
                this.elements.contentContainer.innerHTML = htmlTemplate;

                const btnRefresh = document.getElementById('btnRefresh');
                const btnLiveEdge = document.getElementById('btnLiveEdge');
                if (btnRefresh)
                    btnRefresh.addEventListener('click', () => this.sendCommand('refresh', btnRefresh));
                if (btnLiveEdge)
                    btnLiveEdge.addEventListener('click', () => this.sendCommand('live_to_edge', btnLiveEdge));
            }

            sendCommand(command, btn) {
                if (!this.socket || this.socket.readyState !== WebSocket.OPEN || !this.activeSourceId)
                    return;
                this.socket.send(JSON.stringify({ command, source: this.activeSourceId }));
                if (btn) {
                    btn.disabled = true;
                    setTimeout(() => { btn.disabled = false; }, 2000);
                }
            }

            // Binary frames carry a 1-byte type tag prefix:
            //   0x01 = JPEG video frame
            //   0x02 = Float32 mono 16 kHz PCM audio chunk
            handleBinaryMessage(buffer) {
                const view = new DataView(buffer);
                if (buffer.byteLength < 2) return;
                const tag = view.getUint8(0);
                const payload = buffer.slice(1);
                if (tag === 0x01) {
                    this.onVideoFrame(payload);
                } else if (tag === 0x02) {
                    this.onAudioChunk(payload);
                }
            }

            onVideoFrame(bytes) {
                if (!this.previewVideoOn) return;
                const blob = new Blob([bytes], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);
                const oldUrl = this.previewObjectUrl;
                this.previewObjectUrl = url;
                this.elements.previewImg.src = url;
                this.elements.previewImg.style.display = 'block';
                this.elements.previewPlaceholder.style.display = 'none';
                // Free the prior URL after the new frame has at least had a
                // chance to start decoding. revokeObjectURL is safe to call
                // on URLs the browser is still rendering — the underlying
                // blob stays alive until rendering completes.
                if (oldUrl) {
                    setTimeout(() => URL.revokeObjectURL(oldUrl), 0);
                }
                const now = performance.now();
                if (now - this.previewLastVideoMs > 500) {
                    this.elements.previewMeta.textContent =
                        `video ${(bytes.byteLength / 1024).toFixed(0)} KB`;
                }
                this.previewLastVideoMs = now;
            }

            ensureAudioContext() {
                if (this.audioCtx) return;
                try {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    // Let the browser pick the device sample rate; we
                    // re-sample our 16 kHz chunks into a buffer that the
                    // graph then resamples again on play. The double-resample
                    // cost is negligible at monitoring volume.
                    this.audioCtx = new Ctx();
                    this.audioGain = this.audioCtx.createGain();
                    this.audioGain.gain.value = 1.0;
                    this.audioGain.connect(this.audioCtx.destination);
                } catch (e) {
                    console.warn('AudioContext init failed', e);
                }
            }

            onAudioChunk(buffer) {
                if (!this.audioCtx || !this.previewAudioOn) return;
                const samples = new Float32Array(buffer);
                if (samples.length === 0) return;
                const SRC_RATE = 16000;
                const audioBuf = this.audioCtx.createBuffer(1, samples.length, SRC_RATE);
                audioBuf.copyToChannel(samples, 0);

                const src = this.audioCtx.createBufferSource();
                src.buffer = audioBuf;
                src.connect(this.audioGain);

                // Maintain a small 60 ms jitter window ahead of the playback
                // clock. If we've fallen behind (network blip), reset to
                // `now + jitter` to avoid scheduling in the past.
                const jitter = 0.06;
                const nowT = this.audioCtx.currentTime;
                if (this.audioNextTime < nowT + 0.01) {
                    this.audioNextTime = nowT + jitter;
                }
                src.start(this.audioNextTime);
                this.audioNextTime += audioBuf.duration;
                this.previewSampleCount += samples.length;
            }

            setupPreviewControls() {
                if (this._previewWired) return;
                this._previewWired = true;
                this.elements.btnPlay.addEventListener('click', () => {
                    this.previewVideoOn = !this.previewVideoOn;
                    this.elements.btnPlay.dataset.state = this.previewVideoOn ? 'on' : 'off';
                    this.elements.btnPlay.textContent = this.previewVideoOn ? '⏸ Stop Preview' : '▶ Play Preview';
                    if (this.previewVideoOn) {
                        this.elements.previewPlaceholder.style.display = 'none';
                    } else {
                        this.elements.previewImg.style.display = 'none';
                        this.elements.previewPlaceholder.style.display = '';
                        this.elements.previewMeta.textContent = '';
                    }
                    this.sendCommand(this.previewVideoOn ? 'preview_video_on' : 'preview_video_off', null);
                });
                this.elements.btnAudio.addEventListener('click', () => {
                    this.previewAudioOn = !this.previewAudioOn;
                    this.elements.btnAudio.dataset.state = this.previewAudioOn ? 'on' : 'off';
                    this.elements.btnAudio.textContent = this.previewAudioOn ? '🔈 Audio: On' : '🔈 Audio: Off';
                    if (this.audioGain) {
                        this.audioGain.gain.value = this.previewAudioOn ? 1.0 : 0.0;
                    }
                    if (this.previewAudioOn) {
                        this.audioNextTime = 0;
                    }
                    this.sendCommand(this.previewAudioOn ? 'preview_audio_on' : 'preview_audio_off', null);
                });
                this.elements.btnMute.addEventListener('click', () => {
                    this.muteState = !this.muteState;
                    this.elements.btnMute.dataset.state = this.muteState ? 'on' : 'off';
                    this.elements.btnMute.textContent = this.muteState
                        ? '🔇 Output muted' : '🔊 Mute Output';
                    this.elements.previewMutedBadge.hidden = !this.muteState;
                    this.sendCommand(this.muteState ? 'mute' : 'unmute', null);
                });
                this.elements.btnBlur.addEventListener('click', () => {
                    this.blurState = !this.blurState;
                    this.elements.btnBlur.dataset.state = this.blurState ? 'on' : 'off';
                    this.elements.btnBlur.textContent = this.blurState
                        ? '⚫ Output blurred' : '⚫ Blur Output';
                    this.sendCommand(this.blurState ? 'blur' : 'unblur', null);
                });
            }

            formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            formatUptime(seconds) {
                if (!seconds || seconds <= 0) return '00:00:00';
                const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
                const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                const s = Math.floor(seconds % 60).toString().padStart(2, '0');
                return `${h}:${m}:${s}`;
            }

            generateDashboardHTML(data) {
                const isConnected = data.connected === true;
                const resolutionText = (data.width && data.height) ? `${data.width} × ${data.height}` : '—';

                return `
                    <div class="status-header">
                        <div class="status-indicator">
                            <div class="connection-dot ${isConnected ? 'connected' : ''}"></div>
                            <span style="color: ${isConnected ? 'var(--text-primary)' : 'var(--text-secondary)'}">
                                ${isConnected ? 'Receiving Media' : 'Source Disconnected'}
                            </span>
                        </div>
                        <div class="header-right">
                            <div class="action-buttons">
                                <button class="btn-action" id="btnRefresh">&#x21BB; Refresh</button>
                                <button class="btn-action btn-live-edge" id="btnLiveEdge">&#x26A1; Live Edge</button>
                            </div>
                            <div class="uptime-display">
                                Session Uptime: <span>${this.formatUptime(data.uptime_s || 0)}</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid-section">
                        <div class="section-title">Stream Details</div>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="stat-label">Resolution</span>
                                <span class="stat-value">${resolutionText}</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Video Format</span>
                                <span class="stat-value">${data.video_codec || '—'} 
                                    ${data.hw_accel ? '<span class="badge badge-success" style="margin-left: 8px;">HW</span>' : ''}
                                </span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Audio Format</span>
                                <span class="stat-value">${data.audio_codec || '—'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid-section">
                        <div class="section-title">Real-time Performance</div>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="stat-label">Bitrate</span>
                                <span class="stat-value color-accent">${data.kbps || 0} <span class="stat-unit">kbps</span></span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Framerate</span>
                                <span class="stat-value color-warning">${Number(data.fps || 0).toFixed(2)} <span class="stat-unit">fps</span></span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Buffer Latency</span>
                                <span class="stat-value ${data.latency_ms > 500 ? 'color-warning' : 'color-success'}">
                                    ${data.latency_ms || 0} <span class="stat-unit">ms</span>
                                </span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Stream Delay</span>
                                <span class="stat-value">
                                    ${(data.stream_delay_ms || 0) >= 1000 ? ((data.stream_delay_ms || 0) / 1000).toFixed(1) + '<span class="stat-unit">s</span>' : (data.stream_delay_ms || 0) + '<span class="stat-unit">ms</span>'}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="grid-section">
                        <div class="section-title">Diagnostics & Network</div>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="stat-label">Catch-up Engine</span>
                                <span class="stat-value">
                                    ${data.catchup_active
                        ? `<span class="badge badge-warning">${data.catchup_state} · ${data.catchup_drift_ms} ms</span>`
                        : data.catchup_state && data.catchup_state !== 'Normal'
                            ? `<span class="badge badge-neutral">${data.catchup_state}</span>`
                            : '<span class="badge badge-neutral">Idle</span>'}
                                </span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Tempo</span>
                                <span class="stat-value ${(data.catchup_tempo || 1) > 1.01 ? 'color-warning' : ''}">
                                    ${(data.catchup_tempo || 1).toFixed(3)} <span class="stat-unit">x</span>
                                </span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Dropped Frames</span>
                                <span class="stat-value ${(data.dropped_frames || 0) > 0 ? 'color-danger' : ''}">
                                    ${data.dropped_frames || 0} <span class="stat-unit">total</span>
                                </span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Video Data RX</span>
                                <span class="stat-value">${this.formatBytes(data.total_bytes_video || 0)}</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Audio Data RX</span>
                                <span class="stat-value">${this.formatBytes(data.total_bytes_audio || 0)}</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Network Reset</span>
                                <span class="stat-value">${data.reconnects || 0} <span class="stat-unit">times</span></span>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.appController = new DashboardController();
        });
    </script>
</body>

</html>
