<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Live Stream Source fills in the text, colour and size. Everything in rem follows the size setting. -->
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
html { font-size: calc(1vh * {{scale}} / 100); }
body { display: grid; place-items: center; color: {{color}}; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
body { place-items: end; padding: 3rem; }
.pill { display: inline-flex; align-items: center; gap: 1.5rem; padding: 1.4rem 2.6rem; border-radius: 99rem; background: rgba(12,14,19,.82); border: .2rem solid rgba(242,177,60,.6); font-size: 3.2rem; font-weight: 700; animation: pop .35s cubic-bezier(.2,.9,.3,1.4) both; }
.pill i { width: 1.8rem; height: 1.8rem; border-radius: 50%; background: #f2b13c; animation: pulse 1s ease-in-out infinite; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 1rem rgba(242,177,60,0); opacity: .6; } 0% { box-shadow: 0 0 0 0 rgba(242,177,60,.7); } }
</style>
</head>
<body>
<div class="pill"><i></i>{{text}}</div>
</body>
</html>
