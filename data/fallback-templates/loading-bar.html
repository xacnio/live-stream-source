<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Live Stream Source fills in the text, colour and size. Everything in rem follows the size setting. -->
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
html { font-size: calc(1vh * {{scale}} / 100); }
body { display: grid; place-items: center; color: {{color}}; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
body { background: #0b0d12; }
.wrap { display: grid; justify-items: center; gap: 3rem; width: 78rem; max-width: 96vw; }
h1 { font-size: 4.4rem; font-weight: 600; }
.track { position: relative; width: 100%; height: 1rem; overflow: hidden; border-radius: 1rem; background: rgba(255,255,255,.12); }
.track i { position: absolute; top: 0; bottom: 0; width: 38%; border-radius: 1rem; background: {{color}}; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { from { left: -40%; } to { left: 102%; } }
</style>
</head>
<body>
<div class="wrap"><h1>{{text}}</h1><div class="track"><i></i></div></div>
</body>
</html>
