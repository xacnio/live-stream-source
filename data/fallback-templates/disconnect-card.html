<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Live Stream Source fills in the text, colour and size. Everything in rem follows the size setting. -->
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
html { font-size: calc(1vh * {{scale}} / 100); }
body { display: grid; place-items: center; color: {{color}}; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
.card { display: flex; align-items: center; gap: 3.4rem; padding: 3.6rem 5.4rem; border-radius: 2.6rem; background: rgba(18,21,29,.92); border: .25rem solid rgba(255,255,255,.1); box-shadow: 0 2rem 7rem rgba(0,0,0,.5); animation: rise .5s cubic-bezier(.2,.9,.3,1.2) both; }
svg { width: 8rem; height: 8rem; fill: none; stroke: #ff5a5f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; animation: blink 1.6s ease-in-out infinite; }
h1 { font-size: 5.4rem; font-weight: 700; }
@keyframes rise { from { transform: translateY(3rem) scale(.96); opacity: 0; } }
@keyframes blink { 50% { opacity: .35; } }
</style>
</head>
<body>
<div class="card"><svg viewBox="0 0 24 24"><path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 3.4-2.2M19 12.9a10 10 0 0 0-5.1-2.8M1.6 9.3a15 15 0 0 1 3.2-2.1M22.4 9.3A15 15 0 0 0 10.8 5M12 20h.01"/></svg><h1>{{text}}</h1></div>
</body>
</html>
