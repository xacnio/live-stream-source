<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Live Stream Source fills in the text, colour and size. Everything in rem follows the size setting. -->
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
html { font-size: calc(1vh * {{scale}} / 100); }
body { display: grid; place-items: center; color: {{color}}; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
body { background: linear-gradient(135deg, #10131b, #1a1f2d); }
.wrap { display: grid; justify-items: center; gap: 3.4rem; }
.dots { display: flex; gap: 2rem; }
.dots i { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: {{color}}; animation: hop 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
h1 { font-size: 4.2rem; font-weight: 600; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-2.6rem); opacity: 1; } }
</style>
</head>
<body>
<div class="wrap"><div class="dots"><i></i><i></i><i></i></div><h1>{{text}}</h1></div>
</body>
</html>
