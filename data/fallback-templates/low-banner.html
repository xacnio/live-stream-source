<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Live Stream Source fills in the text, colour and size. Everything in rem follows the size setting. -->
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
html { font-size: calc(1vh * {{scale}} / 100); }
body { display: grid; place-items: center; color: {{color}}; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
body { place-items: start stretch; }
.bar { position: relative; overflow: hidden; padding: 1.4rem 3rem; text-align: center; font-size: 3rem; font-weight: 700; background: linear-gradient(90deg, rgba(120,70,0,.9), rgba(190,120,10,.92), rgba(120,70,0,.9)); animation: drop .4s ease-out both; }
.bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 22%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent); animation: sweep 2.4s linear infinite; }
@keyframes drop { from { transform: translateY(-100%); } }
@keyframes sweep { from { left: -25%; } to { left: 105%; } }
</style>
</head>
<body>
<div class="bar">{{text}}</div>
</body>
</html>
